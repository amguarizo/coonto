server {
    listen 80;
    listen [::]:80;
    server_name dev.coonto.com.br;

    root /var/www/coonto-dev;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|png|webp|css|js|mp3|ogg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
